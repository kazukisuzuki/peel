[package]
name = "peel"
version = "0.6.0"
edition = "2024"
rust-version = "1.89"
description = "A lossless optimizer for JPEG, PNG, and WebP images"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", default-features = false, features = ["std", "help", "usage"] }
glob = "0.3"
libc = "0.2"
lexical-sort = "0.3"
mozjpeg-sys = { version = "2", default-features = false, features = ["unwinding"] }
oxipng = { version = "10.2", default-features = false }
png = "0.18"
tempfile = "3"

[dev-dependencies]
jpeg-decoder = { version = "0.3", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = 2
strip = "symbols"
