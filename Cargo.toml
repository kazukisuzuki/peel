[package]
name = "optijpeg"
version = "0.2.1"
edition = "2024"
description = "A cross-platform, lossless JPEG optimizer that strips metadata"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
libc = "0.2"
lexical-sort = "0.3"
mozjpeg-sys = { version = "2", default-features = false, features = ["unwinding"] }
tempfile = "3"
walkdir = "2"

[dev-dependencies]
jpeg-decoder = { version = "0.3", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = 2
strip = "symbols"
